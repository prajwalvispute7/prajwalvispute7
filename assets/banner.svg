<svg fill="none" width="1200" height="300" viewBox="0 0 1200 300"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#050816"/>

<stop offset="100%" stop-color="#0D1117"/>

</linearGradient>

<linearGradient id="text">

<stop offset="0%" stop-color="#00E5FF"/>

<stop offset="100%" stop-color="#0072FF"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="4" result="coloredBlur"/>

<feMerge>

<feMergeNode in="coloredBlur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<style>

.title{

font:700 56px Arial;

fill:url(#text);

filter:url(#glow);

animation:fade 2s ease-in-out infinite alternate;

}

.subtitle{

font:600 24px Arial;

fill:white;

}

.tech{

font:500 18px Arial;

fill:#00E5FF;

}

.star{

fill:white;

animation:twinkle 3s infinite;

}

@keyframes fade{

from{

opacity:.6;

}

to{

opacity:1;

}

}

@keyframes twinkle{

0%{

opacity:.2;

}

50%{

opacity:1;

}

100%{

opacity:.2;

}

}

</style>

</defs>

<rect width="1200" height="300" fill="url(#bg)"/>

<circle cx="80" cy="40" r="2" class="star"/>

<circle cx="200" cy="120" r="2" class="star"/>

<circle cx="400" cy="60" r="2" class="star"/>

<circle cx="650" cy="80" r="2" class="star"/>

<circle cx="820" cy="40" r="2" class="star"/>

<circle cx="1030" cy="120" r="2" class="star"/>

<circle cx="1150" cy="70" r="2" class="star"/>

<line x1="0" y1="250" x2="1200" y2="250"
stroke="#00C6FF"
stroke-opacity=".2"/>

<line x1="0" y1="260" x2="1200" y2="260"
stroke="#00C6FF"
stroke-opacity=".1"/>

<text x="600" y="110"
text-anchor="middle"
class="title">

PRAJWAL VISPUTE

</text>

<text x="600" y="155"
text-anchor="middle"
class="subtitle">

FULL STACK DEVELOPER

</text>

<text x="600" y="195"
text-anchor="middle"
class="tech">

JAVA • C++ • MERN • REACT • NODE.JS

</text>

<text x="600" y="235"
text-anchor="middle"
fill="#ffffff"
font-size="18">

Building the Future, One Commit at a Time 🚀

</text>
<!-- Animated React Atom -->

<g transform="translate(150 150)" opacity="0.9">

<animateTransform
attributeName="transform"
type="rotate"
from="0 150 150"
to="360 150 150"
dur="18s"
repeatCount="indefinite"/>

<ellipse
cx="0"
cy="0"
rx="45"
ry="16"
stroke="#00E5FF"
stroke-width="2"
fill="none"/>

<ellipse
cx="0"
cy="0"
rx="45"
ry="16"
stroke="#00E5FF"
stroke-width="2"
fill="none"
transform="rotate(60)"/>

<ellipse
cx="0"
cy="0"
rx="45"
ry="16"
stroke="#00E5FF"
stroke-width="2"
fill="none"
transform="rotate(120)"/>

<circle
cx="0"
cy="0"
r="6"
fill="#00E5FF"/>

</g>

<!-- Floating Code -->

<text x="70" y="60"
fill="#00E5FF"
font-size="18"
opacity=".4">

&lt;/&gt;

<animate
attributeName="y"
values="60;45;60"
dur="4s"
repeatCount="indefinite"/>

</text>

<text x="1080" y="90"
fill="#00E5FF"
font-size="18"
opacity=".4">

{}

<animate
attributeName="y"
values="90;70;90"
dur="5s"
repeatCount="indefinite"/>

</text>

<text x="1040" y="220"
fill="#00E5FF"
font-size="18"
opacity=".4">

&lt;React/&gt;

<animate
attributeName="y"
values="220;200;220"
dur="6s"
repeatCount="indefinite"/>

</text>

<text x="100" y="230"
fill="#00E5FF"
font-size="18"
opacity=".4">

Node.js

<animate
attributeName="y"
values="230;210;230"
dur="4.5s"
repeatCount="indefinite"/>

</text>

<!-- Animated Particles -->

<circle cx="250" cy="50" r="2" fill="#00E5FF">

<animate attributeName="cy"
values="50;35;50"
dur="3s"
repeatCount="indefinite"/>

</circle>

<circle cx="950" cy="70" r="2" fill="#00E5FF">

<animate attributeName="cy"
values="70;55;70"
dur="2.8s"
repeatCount="indefinite"/>

</circle>

<circle cx="850" cy="230" r="2" fill="#00E5FF">

<animate attributeName="cy"
values="230;215;230"
dur="3.6s"
repeatCount="indefinite"/>

</circle>

<circle cx="300" cy="220" r="2" fill="#00E5FF">

<animate attributeName="cy"
values="220;200;220"
dur="4.2s"
repeatCount="indefinite"/>

</circle>

<!-- Bottom Glow -->

<rect
x="0"
y="285"
width="1200"
height="15"
fill="#00C6FF"
opacity=".15"/>
  <!-- Floating Code Particles -->

<g fill="#00E5FF" opacity="0.7">

<text x="100" y="180" font-size="20">
&lt;/&gt;
</text>

<text x="1050" y="170" font-size="20">
{ }
</text>

<text x="950" y="80" font-size="18">
JS
</text>

<text x="250" y="70" font-size="18">
C++
</text>

<text x="850" y="230" font-size="18">
NODE
</text>

<text x="300" y="230" font-size="18">
JAVA
</text>

</g>


<!-- React Atom Animation -->

<g transform="translate(600 270)">

<circle r="8"
fill="#61DAFB"/>

<ellipse rx="35"
ry="12"
stroke="#61DAFB"
stroke-width="2"
fill="none">

<animateTransform
attributeName="transform"
type="rotate"
from="0"
to="360"
dur="6s"
repeatCount="indefinite"/>

</ellipse>


<ellipse rx="35"
ry="12"
stroke="#61DAFB"
stroke-width="2"
fill="none"
transform="rotate(60)">

<animateTransform
attributeName="transform"
type="rotate"
from="0"
to="360"
dur="6s"
repeatCount="indefinite"/>

</ellipse>


<ellipse rx="35"
ry="12"
stroke="#61DAFB"
stroke-width="2"
fill="none"
transform="rotate(120)">

<animateTransform
attributeName="transform"
type="rotate"
from="0"
to="360"
dur="6s"
repeatCount="indefinite"/>

</ellipse>

</g>


<!-- Neon Moving Lines -->

<path d="M0 280 Q300 240 600 280 T1200 280"
stroke="#00C6FF"
stroke-width="2"
fill="none">

<animate
attributeName="d"
values="
M0 280 Q300 240 600 280 T1200 280;
M0 280 Q300 320 600 280 T1200 280;
M0 280 Q300 240 600 280 T1200 280
"
dur="5s"
repeatCount="indefinite"/>

</path>


<!-- Glow Circle -->

<circle cx="1000"
cy="230"
r="35"
fill="none"
stroke="#0072FF"
stroke-width="2"
opacity="0.5">

<animate
attributeName="r"
values="35;55;35"
dur="3s"
repeatCount="indefinite"/>

</circle>


<circle cx="200"
cy="220"
r="25"
fill="none"
stroke="#00E5FF"
stroke-width="2"
opacity="0.5">

<animate
attributeName="r"
values="25;45;25"
dur="4s"
repeatCount="indefinite"/>

</circle>


<!-- Footer Glow -->

<text x="600"
y="285"
text-anchor="middle"
font-size="14"
fill="#00E5FF">

⚡ CODE • CREATE • INNOVATE ⚡

</text>


</svg>
